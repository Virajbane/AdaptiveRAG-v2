# .github/workflows/eval.yml
name: RAG Evaluation Suite

on:
  pull_request:
    paths:
      - 'backend/app/agents/**'
      - 'backend/app/services/retrieval/**'
      - 'backend/app/agents/prompts.py'
  push:
    branches: [main]

jobs:
  fast-checks:
    # Router + retrieval eval only — no LLM generation, runs in seconds, on EVERY PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-eval.txt
      - run: cd backend && python -m eval.router_eval.run_router_eval
      - run: cd backend && python -m eval.retrieval_eval.run_retrieval_eval

  regression-suite:
    # DeepEval regression tests — the "did I break a known bug fix" gate
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-eval.txt
      - run: cd backend && pytest eval/deepeval_suite/test_regression.py -m regression --html=eval/reports/regression.html

  full-eval:
    # Full Ragas + DeepEval suite — only on push to main (slower, LLM-judge heavy)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: regression-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-eval.txt
      - run: cd backend && python -m eval.ragas_eval.run_ragas
      - run: cd backend && pytest eval/deepeval_suite/ --html=eval/reports/full_deepeval.html
      - run: cd backend && python -m eval.reports.report_builder
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: backend/eval/reports/